services:
  webui:
    image: ghcr.io/adeotek/claude-code-webui:latest
    build:
      context: .
    ports:
      - "8080:9998"
    environment:
      - CLAUDE_BIN=${CLAUDE_BIN:-claude}
    volumes:
      # Mount Claude Code credentials and session data (read-write for session deletion)
      - ~/.claude:/root/.claude:rw
      # Mount projects directory for working directory access
      - ~/projects:/projects:rw
    restart: unless-stopped
